# Segment cache for the watch proxy. Goes in the http{} context, NOT in a
# server{} block — install as /etc/nginx/conf.d/watch-cache.conf.
#
# Why: every viewer pulls its own copy of every segment, so a room of N people
# multiplies both CDN downloads and disk/network work by N — even though a
# watch-party has everyone on the exact same bytes by definition. Within one
# room the signed URL is identical for all viewers, so the cache key matches
# and the segment is fetched from the CDN once.
#
# Sizing: 1080p segments run ~3.5 MB and a two-hour film is roughly 4 GB per
# room, so 10g holds a couple of concurrent rooms. max_size evicts by LRU, so
# it — not inactive — is what actually bounds the disk. An hour of inactive
# keeps a segment around long enough for someone who seeks back or joins late,
# which was not true at 30m.
#
# levels=1:2 keeps directory fanout sane; use_temp_path=off writes straight
# into the cache dir instead of copying through a temp path.
proxy_cache_path /var/cache/nginx/watch
                 levels=1:2
                 keys_zone=watch_segments:20m
                 max_size=10g
                 inactive=1h
                 use_temp_path=off;

# Keepalive pool to the app. Without an upstream{} block nginx sends
# `Connection: close` and opens a fresh TCP connection to Node for every
# request — and a room streaming 1080p is hundreds of segment requests per
# viewer per film. Eight idle connections cover the traffic of a few rooms;
# the Connection "" header that makes reuse possible is set per location.
upstream watch_node {
    server 127.0.0.1:3000;
    keepalive 8;
}

# Whether the segment cache is working is currently unanswerable after the fact:
# X-Cache-Status is a response header only, the vhost logs the stock `combined`
# format, and journald keeps a single day of the app's own logs. This adds the
# cache verdict and both timings, so a "it buffered last night" report can be
# checked against what actually happened.
#
# buffer/flush keep it off the hot path: one write per 64 KB instead of one per
# segment, on the same disk the cache lives on.
log_format watch '$remote_addr $status $body_bytes_sent $upstream_cache_status '
                 '$request_time $upstream_response_time "$request_uri"';
