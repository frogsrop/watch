# Kernel tuning for the watch proxy. Install as /etc/sysctl.d/99-watch.conf and
# apply with `sudo sysctl --system`. Takes effect immediately, no reboot.
#
# NOTE: this box is shared — mail (Postfix/Dovecot), postgres, a game server and
# two VPN containers live here too. Only settings that are safe for all of them
# belong in this file. BBR itself is already configured separately in
# /etc/sysctl.d/99-bbr.conf.

# The one that matters for this workload. hls.js keeps 60 seconds of video
# buffered ahead (maxBufferLength in player.js), so segments arrive in bursts
# with multi-second idle gaps between them. By default Linux treats a connection
# idle for longer than one RTO as new and collapses the congestion window back
# to the initial value, so BBR re-ramps on EVERY burst — for the whole film.
# hls-proxy.ts already reasons about this exact idle pattern on the CDN side
# (keepAliveTimeout 60s); this is the same shape on the viewer side.
#
# Safe for the co-tenants: it only stops the window from decaying while idle. It
# does not change the response to loss, so a connection that genuinely congests
# still backs off normally.
net.ipv4.tcp_slow_start_after_idle = 0

# Deliberately NOT set here, and why:
#
#   net.core.default_qdisc = fq
#     "BBR needs fq" stopped being true in Linux 4.13, which added TCP-internal
#     pacing; this kernel is 6.12. The setting is global, so it would strip
#     fq_codel's AQM from mail and everything else on the box for no gain.
#
#   initcwnd 30 on the default route
#     Applies to every outbound connection including Postfix deliveries, does
#     nothing for HTTP/3 (QUIC has its own initial window), and puts a 44 KB
#     burst on a path already documented as loss-prone.
