# The single source of truth for the HTTP/3 advertisement.
# Install as /etc/nginx/snippets/watch-alt-svc.conf.
#
# Why a snippet rather than a literal header. This has to be declared TWICE —
# once at server level and once inside the segment-cache location, because that
# location declares its own `add_header X-Cache-Status` and nginx drops every
# inherited add_header the moment a block declares one of its own. Two copies of
# a header that has to stay in sync is exactly how you end up advertising h3 on
# segments only: you edit the server-level one, forget the location, and half
# your traffic silently disagrees with the other half.
#
# It also makes withdrawing h3 a one-line edit in one file, which matters because
# that is both the emergency stop and the way a control group is created for
# measuring h2 against h3 at all.
#
# ma is the advertisement lifetime in seconds, and it is therefore the latency of
# switching a viewer's control group. 600 is deliberately short while h3 is being
# measured: at ma=86400 a control window cannot begin until a day after the
# header changes, and any h3 regression takes a day to stop hurting people. The
# cost is that browsers rediscover h3 more often, so slightly more first
# connections land on TCP — a small handicap to h3, accepted for measurability.
# Raise back to 86400 once h3 is decided.
add_header Alt-Svc 'h3=":443"; ma=600' always;

# To withdraw h3, do NOT just delete the line above: cached announcements stay
# valid for the previous ma. Replace it with the RFC 7838 invalidation, leave it
# for at least the old ma, and only then remove it:
#
#   add_header Alt-Svc 'clear' always;
#
# Keep `listen 443 quic reuseport` in place either way — h3 stays reachable for
# `curl --http3-only` and for Chrome with --origin-to-force-quic-on, so testing
# survives and re-enabling is one line here.
#
# Faster emergency stop, no config edit and no reload: `ufw deny 443/udp`.
# Browsers with a cached Alt-Svc pay one failed QUIC attempt per new connection
# and then mark the origin QUIC-broken on their own.
