# nginx location blocks for subpath deploy (PUBLIC_BASE_PATH=/watch).
# Paste inside an existing `server { listen 443 ssl; ... }` block —
# this is what runs on frogsrop.dev, where / is already used by other services.
#
# proxy_pass has NO trailing slash on purpose: the app registers its own routes
# under /watch, so nginx must forward the prefix instead of stripping it.
#
# The segment cache below needs proxy_cache_path and the watch_node upstream in
# the http{} context — install deploy/nginx-watch-cache.conf as
# /etc/nginx/conf.d/watch-cache.conf first, or nginx will refuse to start with
# "watch_segments not found".
#
# gzip is declared inside these locations rather than in http{}: this vhost also
# serves kotobilet, vkmusic and tg-bot-test, and compression settings must not
# leak into their paths. gzip_proxied matters most — its default (off) is why an
# http{}-level `gzip on` never compressed anything of ours: every response here
# comes back through proxy_pass.

location = /watch { return 301 /watch/; }

# Segment cache. A regex location outranks the /watch/ prefix below, so segment
# and subtitle requests land here while everything else falls through.
#
# Everyone in a room requests the identical signed URL, so one CDN fetch serves
# the whole room instead of one per viewer. Cache key is the default
# ($scheme$proxy_host$request_uri) — the room id and HMAC are already in the
# URI, so rooms cannot read each other's entries.
#
# /sub/ is here too: those are VTT subtitle files, immutable for the life of the
# episode, and the app already marks them cacheable. Only the browser was
# honouring that; now a room fetches each one from the CDN once.
location ~ ^/watch/hls/[A-Za-z0-9_-]+/(p|sub)/ {
    proxy_pass http://watch_node;
    proxy_http_version 1.1;
    # Required for keepalive to the upstream: nginx defaults to
    # `Connection: close`, which defeats the pool in watch-cache.conf.
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # Variant playlists and subtitles are text and compress an order of
    # magnitude; video/mp2t is deliberately absent because segments are already
    # compressed and running them through gzip would only burn the single core.
    # nginx compresses on the way out, after the cache, so entries stay
    # identity-encoded and are reused for clients regardless of what they accept.
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/vnd.apple.mpegurl text/vtt;

    proxy_cache watch_segments;
    # Viewers are synchronised, so they ask for the same segment at the same
    # moment. Without the lock every one of them is a cache miss and they all
    # stampede the CDN — which is exactly the load this is meant to remove.
    # The wait is generous because a 1080p segment is several MB.
    proxy_cache_lock on;
    proxy_cache_lock_timeout 20s;
    proxy_cache_lock_age 20s;
    # The app sends max-age=300; ignoring it lets one setting govern retention.
    proxy_ignore_headers Cache-Control Expires;
    # A finished film does not change, so the only real limit is disk, which
    # max_size already enforces by LRU. Two hours means someone who seeks back
    # an hour, or joins a room already halfway through, still gets a hit.
    proxy_cache_valid 200 2h;
    # Only whole responses are cached. A 206 varies by Range, which is not in
    # the key, so caching one would risk serving the wrong byte range.
    proxy_cache_bypass $http_range;
    proxy_no_cache $http_range;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    add_header X-Cache-Status $upstream_cache_status always;
    # Declaring add_header here drops every add_header inherited from server{},
    # so the HTTP/3 advertisement has to be repeated. Keep in sync with
    # deploy/nginx-watch-quic.conf; harmless if QUIC is not enabled.
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# Longer prefix wins over /watch/, so WS traffic lands here. Hardcoded "upgrade"
# avoids needing a $connection_upgrade map in the http{} context.
location /watch/ws/ {
    # No keepalive pool here on purpose: an upgraded connection is not reusable,
    # and Connection must stay "upgrade" for the handshake to work at all.
    proxy_pass http://watch_node;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location /watch/ {
    proxy_pass http://watch_node;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # Manifests and API responses stream straight through; segments are handled
    # by the caching location above, which needs buffering left on.
    proxy_buffering off;

    # The entry manifest is the big win here: every segment line is rewritten
    # into a ~250-character signed self-URL, so a two-hour film ships hundreds
    # of kilobytes of highly repetitive text. hls.js and the stylesheet are the
    # other bulk. Segments never reach this location.
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/vnd.apple.mpegurl text/vtt text/css application/javascript
               text/javascript application/json image/svg+xml;
    # /api/probe and /api/extract run Playwright, which can take tens of seconds.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
