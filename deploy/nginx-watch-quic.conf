# HTTP/3 (QUIC) for the watch vhost. These are server-level directives — paste
# them into the same `server { listen 443 ssl; ... }` block that holds the
# /watch/ locations, alongside the existing listen lines. Do NOT include this
# inside a location.
#
# Why bother: the bottleneck measured on frogsrop.dev is not bandwidth but a
# single connection. RTT to viewers is 56-133ms with jitter up to 27ms and
# hundreds of retransmits per connection, so one stream carries 5.8-10 Mbps
# while three in parallel total 16.5 Mbps. That is the loss-and-latency limit
# (bandwidth ~ MSS / (RTT * sqrt(loss))), and it is what QUIC addresses: no
# transport-level head-of-line blocking, and better loss recovery than the
# HTTP/2-over-TCP we serve today.
#
# Scope: this only helps the viewer<->server hop. Server<->CDN stays TCP; that
# side is not ours. And viewers are in Russia, where DPI often throttles or
# blocks UDP/443 — browsers then fall back to HTTP/2 silently, so this is
# upside-only, but the upside may simply not materialise for some people.

# TCP stays for HTTP/1.1 and HTTP/2, and as the fallback when UDP is blocked.
# QUIC is an addition, never a replacement.
#
# `reuseport` IS REQUIRED, not a tuning knob. Without it every worker shares one
# UDP socket and the kernel hands each arriving datagram to whichever worker
# happens to read first, so consecutive packets of the SAME QUIC connection land
# in DIFFERENT workers. QUIC connection state is per-worker, so each one builds
# a partial handshake for the same connection id and the client is dropped. With
# worker_processes auto on this 4-core box that broke HTTP/3 completely, while
# leaving TCP h2 healthy — so it looked like a network problem, not a config
# one. What it looks like in a debug log (two workers, one client port, one
# dcid, different packet numbers):
#
#   3443120 *1779 quic recvmsg: 159.195.48.180:22603 fd:10 n:1200
#   3443121 *1778 quic recvmsg: 159.195.48.180:22603 fd:10 n:1200
#   3443120 *1779 quic packet rx number:0 ...  dcid 58f7803be17cf3d4
#   3443121 *1778 quic packet rx number:1 ...  dcid 58f7803be17cf3d4
#
# SO_REUSEPORT gives each worker its own socket and makes the kernel hash by
# 4-tuple, so one client always reaches one worker. Verified 2026-08-03: 0/10
# requests succeeded without it, 20/20 with it.
#
# It must appear on at most ONE listen per address:port across the WHOLE config,
# otherwise nginx fails with "duplicate listen options". This box serves several
# vhosts on 443 (frogsrop.dev, mail.frogsrop.org, default), so if another one
# ever gains a `quic` listener, only one of them may carry it. v4 and v6 are
# separate sockets, so each of the two lines below takes its own.
listen 443 quic reuseport;
listen [::]:443 quic reuseport;

# QUIC mandates TLS 1.3. The vhost already allows it (TLSv1.2 TLSv1.3), so the
# existing certificate is reused as-is; TLS 1.2 clients keep using TCP.

# THE reason h3 was not faster than h2, and the only directive that addresses it.
#
# ngx_quic_stream_send_chain() holds `sent - acked <= http3_stream_buffer_size`,
# so one stream cannot exceed buffer/RTT no matter what the congestion window
# says. hls.js fetches fragments essentially one at a time, so that per-stream
# cap IS the connection's throughput. At the 64k default:
#
#   measured, real viewer, loaded RTT 102 ms:  h2+BBR 8.56 Mbit/s vs h3 ceiling
#                                              64KiB/102ms = 5.14 Mbit/s
#   measured, this dev box, RTT 55 ms:         predicted ceiling 9.5 Mbit/s,
#                                              observed 7.9 (nginx log, n=124)
#                                              and 8.2-11.5 (client telemetry)
#
# i.e. h3 was pinned to ~60% of h2 by a config default. BDP here is ~63 KiB, so
# the default is almost exactly 1xBDP and cannot fill the pipe.
#
# 256k, NOT the 1024k upstream nginx/nginx#217 converged on. This is a fixed
# window and nginx has no sender pacing in any version, so anything above the BDP
# becomes standing queue rather than goodput: 1024k induces ~780 ms of queue on a
# 10 Mbit link, which is outside player.js's DRIFT_DEADZONE_S (0.3 s) and would
# drive spurious playbackRate corrections on the WebSocket sharing that link.
# 256k gives a 20.6 Mbit/s ceiling at 102 ms for ~155 ms of queue — inside the
# deadzone. Sizing target: 1080p is 5.2 Mbit/s and hls.js fills maxBufferLength
# 60 s, so 4x headroom at the worst RTT (133 ms) is ~349 KB. Nothing here needs
# more, and 384k is the one step left if a distant viewer is still capped.
http3_stream_buffer_size 256k;

# MOVES WITH THE LINE ABOVE, NEVER SEPARATELY. initial_max_data is
# (streams + 3) * buffer, so raising the buffer alone multiplies the advertised
# per-connection credit — the memory one client can make nginx hold — by 4:
# (128+3)*64k = 8.19 MiB today, (128+3)*256k = 32.75 MiB, but (32+3)*256k =
# 8.75 MiB. Same exposure, redistributed into fewer fatter streams. That matters
# because /api/extract takes no auth. Peak parallel streams for a room is 8-12
# (page assets + manifest + 1-2 fragments + subtitle + telemetry POST), and
# exceeding the limit only queues streams, it does not fail them.
http3_max_concurrent_streams 32;

# Address-validation handshake. Costs one extra round trip for new clients but
# stops the server being used as a UDP amplification reflector.
quic_retry on;

# Coalesce QUIC packets into one sendmsg() via UDP_SEGMENT (kernel 6.12 here
# supports it). Without it a 3.5 MB segment over h3 is ~2900 syscalls; with it,
# a few dozen — the bytes are already in page cache, so what remains is
# per-packet cost.
#
# LEFT OFF, and this time it was actually measured rather than assumed. Once
# reuseport made h3 work, 20 identical requests for hls.min.js over h3 scored
# 9/10 with quic_gso on and 9/10 with it off — the failures are unrelated to it,
# so it buys nothing here and only adds a virtio UDP-GSO failure mode. Revisit
# if h3 ever carries real segment volume; verify with the command below, and
# treat an intermittent "HTTP/3 stream 0 reset by server" as its signature.
#
#   curl --http3-only -sI https://frogsrop.dev/watch/api/health
#quic_gso on;

# Deliberately NOT enabling ssl_early_data. 0-RTT would shave a round trip, but
# early data is replayable, and /api/extract and /api/room/<id>/switch are not
# idempotent — a replayed switch would yank the whole room to another episode.

# Tells the browser HTTP/3 exists; it upgrades on the NEXT request, so the very
# first page load is always TCP.
#
# Kept in a snippet because it has to be declared twice — see the file itself.
# The segment-cache location in nginx-watch.conf includes the same snippet,
# because a location that declares its own add_header inherits none.
include snippets/watch-alt-svc.conf;
