# HTTP/3 (QUIC) for the watch vhost. These are server-level directives — paste
# them into the same `server { listen 443 ssl; ... }` block that holds the
# /watch/ locations, alongside the existing listen lines. Do NOT include this
# inside a location.
#
# Why bother: the bottleneck measured on frogsrop.dev is not bandwidth but a
# single connection. RTT to viewers is 56-133ms with jitter up to 27ms and
# hundreds of retransmits per connection, so one stream carries 5.8-10 Mbps
# while three in parallel total 16.5 Mbps. That is the loss-and-latency limit
# (bandwidth ~ MSS / (RTT * sqrt(loss))), and it is what QUIC addresses: no
# transport-level head-of-line blocking, and better loss recovery than the
# HTTP/2-over-TCP we serve today.
#
# Scope: this only helps the viewer<->server hop. Server<->CDN stays TCP; that
# side is not ours. And viewers are in Russia, where DPI often throttles or
# blocks UDP/443 — browsers then fall back to HTTP/2 silently, so this is
# upside-only, but the upside may simply not materialise for some people.

# TCP stays for HTTP/1.1 and HTTP/2, and as the fallback when UDP is blocked.
# QUIC is an addition, never a replacement.
listen 443 quic;
listen [::]:443 quic;

# `reuseport` must appear on at most ONE listen per address:port across the
# WHOLE config, otherwise nginx fails with "duplicate listen options". This box
# serves several vhosts on 443 (frogsrop.dev, mail.frogsrop.org, default), so
# if another one ever gains a `quic` listener, only one of them may carry it.
# Add it to the line above as `listen 443 quic reuseport;` — worth having, it
# spreads UDP load across workers.

# QUIC mandates TLS 1.3. The vhost already allows it (TLSv1.2 TLSv1.3), so the
# existing certificate is reused as-is; TLS 1.2 clients keep using TCP.

# Address-validation handshake. Costs one extra round trip for new clients but
# stops the server being used as a UDP amplification reflector.
quic_retry on;

# Coalesce QUIC packets into one sendmsg() via UDP_SEGMENT (kernel 6.12 here
# supports it). Without it a 3.5 MB segment over h3 is ~2900 syscalls; with it,
# a few dozen. This is worth more on this box than any disk-side tuning, because
# the bytes are already in page cache and the cost that remains is per-packet.
#
# Verify after enabling — some virtio network paths mishandle UDP GSO and the
# symptom is h3 silently failing while h2 keeps working:
#   curl --http3-only -sI https://frogsrop.dev/watch/api/health
quic_gso on;

# Deliberately NOT enabling ssl_early_data. 0-RTT would shave a round trip, but
# early data is replayable, and /api/extract and /api/room/<id>/switch are not
# idempotent — a replayed switch would yank the whole room to another episode.

# Tells the browser HTTP/3 exists; it upgrades on the NEXT request, so the very
# first page load is always TCP. ma is the advertisement lifetime in seconds.
#
# TRAP: add_header does not inherit into any location that declares its own
# add_header. The segment-cache location sets X-Cache-Status, so it repeats
# this header itself — keep the two in sync.
add_header Alt-Svc 'h3=":443"; ma=86400' always;
